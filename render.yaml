services:
  # Python FastAPI Backend Service
  - type: web
    name: voice-rag-backend
    env: python
    region: oregon
    plan: standard
    buildCommand: pip install --no-cache-dir -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SARVAM_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://voice-rag-frontend.onrender.com,http://localhost:5173"
      - key: LOG_LEVEL
        value: INFO

  # Static React / Vite Frontend
  - type: web
    name: voice-rag-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: voice-rag-backend
          property: host
